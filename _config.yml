# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: 멀티모달 용병 스카우팅 플랫폼
email: bsgum5373@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  생활체육 경기 영상에서 선수의 실력을 재고, 그 근거로 팀이 빈 자리에 맞는 용병을
  찾는 플랫폼. 4인 팀 프로젝트이며, 이 사본은 백성검의 작업분을 함께 보여 줍니다.
baseurl: "" # supersub.paiksunggum.com 루트에 배포하므로 서브패스 없음
url: "https://supersub.paiksunggum.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  paiksunggum

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed

# Just the Docs 테마 설정 (dev.life-tutorial.com과 동일 테마)
color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "위로"
nav_sort: case_sensitive # 각 페이지의 nav_order 값을 그대로 따름

aux_links:
  "내 역할":
    - "/내-역할/"
  "팀 저장소":
    - "https://github.com/pmhllll12/super-sub.cloud"
aux_links_new_tab: true

footer_content: "Super-Sub 팀 프로젝트 (박민호 · 백성검 · 정상호 · 정어진) &middot; 이 사본은 <a href=\"/내-역할/\">백성검의 작업분</a>을 함께 보여 줍니다 &middot; 원본 <a href=\"https://dev.supersub-ai.com\">dev.supersub-ai.com</a>"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# demo/ is a separate, self-contained Jekyll site (its own _config.yml,
# Gemfile, layouts) kept here for reference — excluded so it doesn't get
# built or served as part of this site. supersub-preview.service is the
# systemd unit for the local preview server, not site content.
# agent/ is the Python implementation of the AI analysis agent (see
# chapter 6). flutter/ is the Flutter app implementation. fastapi/ is the
# backend API server source. All three are source code, not site
# content — excluded from the build.
exclude:
  - demo/
  - agent/
  - flutter/
  - supersub-preview.service
  - fastapi/
  - www/
  # 사이트 페이지·그림 생성기. 결과물(jekyll/progress/·assets/erd/)은 발행되지만
  # 만드는 쪽은 발행 대상이 아니다. git 에는 그대로 있다 — `tools/README.md`.
  - tools/
  # 팀·개인용 작업 지침이라 공개 사이트에 실을 것이 아니다.
  # ⚠️ 이건 **Jekyll 발행 제외**일 뿐 git 과는 무관하다 — CLAUDE.md 는 그대로
  #    저장소에 있고 pull 하면 받는다(fastapi/ 와 같다).
  - CLAUDE.md
  - CLAUDE.local.md
